<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore the history of Earth, historical events, and overlapping lives on one interactive timeline.">
    <meta name="theme-color" content="#f6f3eb">
    <title>Atlas of Time</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./timeline.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="shell" aria-labelledby="page-title">
      <h1 id="page-title" class="visually-hidden" data-copy="title">Atlas of Time</h1>
      <div id="timeline-overviews" class="overview-panel"></div>
      <div class="explorer" id="explorer">
        <aside class="filters" id="filters" aria-labelledby="filter-heading">
          <div class="filter-heading">
            <p class="eyebrow" data-copy="catalogue">WIKIDATA CATALOGUE</p>
            <h2 id="filter-heading" data-copy="filters">Layers</h2>
            <p data-copy="filterHint">Choose what appears on the timeline.</p>
          </div>
          <ul id="category-tree" class="category-tree"></ul>
          <div class="filter-footer">
            <span id="selected-count"></span>
            <button class="text-button" id="clear-filters" type="button" disabled data-copy="clear">Clear</button>
          </div>
        </aside>

        <section class="timeline-panel" aria-labelledby="workspace-heading">
          <div class="workspace-toolbar">
            <div class="toolbar-actions toolbar-start">
              <button class="toolbar-button" id="toggle-filters" type="button" aria-controls="filters" aria-expanded="true">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.65">
                  <rect x="3" y="5" width="18" height="14" rx="1.8"/><path d="M9 5v14M5.5 9h1M5.5 12h1"/>
                </svg>
                <span data-copy="filters">Layers</span>
              </button>
              <button class="toolbar-button" id="human-history" type="button">Human history</button>
            </div>
            <div class="window-controls">
              <div class="window-label">
                <h2 id="workspace-heading" class="eyebrow" data-copy="visibleRange">VISIBLE RANGE</h2>
                <span id="range-label" class="range-label">—</span>
              </div>
              <label class="toolbar-select" id="ranking-control" for="ranking" hidden>
                <span class="visually-hidden" data-copy="ranking">Article notability</span>
                <select id="ranking" aria-describedby="ranking-description" disabled></select>
              </label>
              <span class="visually-hidden" id="ranking-description" data-copy="rankingHint"></span>
            </div>
            <div class="toolbar-actions toolbar-end">
              <label class="toolbar-select" for="language">
                <span class="visually-hidden" data-copy="language">Catalogue language</span>
                <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.2 2.5 3.4 5.5 3.4 9s-1.2 6.5-3.4 9c-2.2-2.5-3.4-5.5-3.4-9s1.2-6.5 3.4-9Z"/>
                </svg>
                <select id="language" disabled><option value="en">English</option></select>
              </label>
              <button class="toolbar-button" id="reset-range" type="button" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 11a8 8 0 1 1 2.4 6M4 6v5h5"/>
                </svg>
                <span data-copy="reset">Reset view</span>
              </button>
            </div>
          </div>

          <div id="timeline"></div>
          <div class="workspace-footer">
            <div class="workspace-status">
              <span id="data-status" role="status" aria-live="polite">Loading catalogue…</span>
              <button class="text-button" id="retry-load" type="button" hidden data-copy="retry">Retry</button>
            </div>
            <span class="source-pill" id="dataset-label" hidden></span>
            <span class="gesture-hint" data-copy="gestures">Wheel to zoom · Drag or Shift + wheel to pan</span>
          </div>
          <noscript><p class="no-script">Enable JavaScript to explore the timeline.</p></noscript>
        </section>
      </div>

      <footer class="shell-footer">
        <span data-copy="footer">A timeline built from linked open data.</span>
        <a href="https://www.wikidata.org/" target="_blank" rel="noopener noreferrer">Wikidata <span aria-hidden="true">↗</span></a>
      </footer>
    </main>
  </body>
</html>
